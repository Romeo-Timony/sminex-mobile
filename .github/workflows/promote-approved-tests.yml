name: Promote Approved Tests

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: 'Jira Key to promote (e.g., KAN-4). Leave empty to promote all pending review.'
        required: false
        default: ''
      verify:
        description: 'Run verification tests (pytest) before promotion'
        type: boolean
        required: true
        default: true

jobs:
  promote:
    name: Promote reviewed tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ github.event.inputs.verify == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium Server
        if: ${{ github.event.inputs.verify == 'true' }}
        run: |
          npm install -g appium
          appium -v
          # Запуск в фоновом режиме
          appium --port 4723 &

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run promotion script
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT_CODE: "ROMEO"
        run: |
          CMD="python promote_review_tests.py --apply"
          if [ "${{ github.event.inputs.verify }}" = "true" ]; then
            CMD="$CMD --verify"
          fi
          if [ -n "${{ github.event.inputs.jira_key }}" ]; then
            CMD="$CMD --jira-key ${{ github.event.inputs.jira_key }}"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push Promoted Tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/
          git status
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: promote approved tests for ${{ github.event.inputs.jira_key || 'all keys' }}"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
