name: Promote Approved Tests

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: 'Jira Key to promote (for example, KAN-4).'
        required: true
      verify:
        description: 'Run verification tests (pytest) before promotion'
        type: boolean
        required: true
        default: true

jobs:
  promote:
    name: Promote reviewed tests
    # UI/E2E checks require the installed app and an Android emulator/device.
    runs-on: [self-hosted, windows]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ github.event.inputs.verify == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium Server
        if: ${{ github.event.inputs.verify == 'true' }}
        shell: pwsh
        run: |
          npm install -g appium
          appium -v
          # Запуск в фоновом режиме
          Start-Process appium -ArgumentList '--port', '4723' -WindowStyle Hidden

      - name: Check Android device
        if: ${{ github.event.inputs.verify == 'true' }}
        shell: pwsh
        run: |
          if (-not (Get-Command adb -ErrorAction SilentlyContinue)) {
            throw 'Android platform-tools (adb) are not available on this runner.'
          }
          if (-not (adb devices | Select-String "\tdevice$")) {
            throw 'No Android emulator or device is connected to this runner.'
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run promotion script
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT_CODE: "ROMEO"
          QASE_FIELD_AUTOMATION_COVERAGE: "1"
          QASE_FIELD_AUTOMATION_TYPE: "2"
          QASE_FIELD_AUTOMATION_CODE_PATH: "3"
          QASE_FIELD_AUTOMATION_TEST_ID: "4"
          QASE_FIELD_AUTOMATION_NOTE: "5"
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          DEBUG_OTP_ENABLED: "true"
        shell: pwsh
        run: |
          $arguments = @('tools/promote_review_tests.py', '${{ inputs.jira_key }}', '--apply')
          if ('${{ inputs.verify }}' -eq 'true') {
            $arguments += '--verify'
          }
          python @arguments

      - name: Commit and Push Promoted Tests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "chore: promote approved tests for ${{ inputs.jira_key }}"
          git push origin HEAD:${{ github.ref_name }}
