name: Verify Review Tests CI

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'tests/review/**'

jobs:
  verify:
    name: Run pytest verification on review tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium Server
        run: |
          npm install -g appium
          appium -v
          # Запуск в фоновом режиме
          appium --port 4723 &

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verification using pytest
        run: |
          pytest tests/review/ -v -m review
