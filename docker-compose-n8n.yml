version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-dev-instance
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=stylish-mary-bluebelled.ngrok-free.dev
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://stylish-mary-bluebelled.ngrok-free.dev/
      - WEBHOOK_URL=https://stylish-mary-bluebelled.ngrok-free.dev/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Europe/Moscow
      # Фиксированный ключ шифрования для сохранения учётных записей и сессий при перезапусках
      - N8N_ENCRYPTION_KEY=sminex-n8n-static-encryption-key-2026
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-dev
    ports:
      - "8081:8080"
    environment:
      - SEARXNG_SECRET=searxng-secret-key-456
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped

volumes:
  n8n_data:
