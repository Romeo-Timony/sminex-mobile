version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-dev-instance
    ports:
      - "5678:5678"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .n8n-agent.env
      - .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Moscow
      # Фиксированный ключ шифрования для сохранения учётных записей и сессий при перезапусках
      - N8N_ENCRYPTION_KEY=sminex-n8n-static-encryption-key-2026
      # Ключи и токены окружения
      - JIRA_URL=https://romeo-timony.atlassian.net
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-dev
    ports:
      - "8081:8080"
    environment:
      - SEARXNG_SECRET=searxng-secret-key-456
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped

volumes:
  n8n_data:
