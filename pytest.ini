[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -v --strict-markers --alluredir=allure-results --clean-alluredir
markers =
    ui: UI checks running through Appium
    api: API contract checks against the configured test environment
    e2e: critical end-to-end user journeys
    positive: positive scenarios
    negative: negative scenarios
    smoke: fast checks for a release gate
    regression: extended regression suite
    critical: business-critical checks that block release on failure
    requires_debug_otp: test requires a test build exposing a debug OTP value
    quarantined: known unstable test; excluded from release gates
    ui_mock: isolated UI check that uses WireMock instead of a live backend
    mock: mock-server infrastructure and contract checks
    review: generated test awaiting QA review before merge
    qase_case(case_id): numeric ID of the original manual Qase case covered by this test
